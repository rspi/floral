<ds-field>
  <label slot="label" for="username">Username</label>
  <ds-input
    id="username"
    aria-invalid="true"
    aria-errormessage="username-error"
    aria-describedby="username-error username-helper"
  ></ds-input>
  <span slot="error" id="username-error">Username is already taken.</span>
  <span slot="helper" id="username-helper">Choose a unique username.</span>
</ds-field>
